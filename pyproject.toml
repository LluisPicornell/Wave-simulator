[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wavesim"
version = "0.1.0"
description = "Simulador de ondas (ultrasonido, electromagnéticas y resonancia magnética) a través de tejidos humanos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]
fast = ["numba>=0.59"]

[tool.setuptools.packages.find]
include = ["wavesim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
